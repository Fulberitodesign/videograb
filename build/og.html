<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #07070e; color: #f3f4fa; font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; position: relative; }
  .blob { position: absolute; border-radius: 50%; filter: blur(110px); }
  .b1 { width: 620px; height: 620px; background: #6d5cff; top: -240px; left: -160px; opacity: .6; }
  .b2 { width: 560px; height: 560px; background: #00b8ff; bottom: -260px; right: -120px; opacity: .55; }
  .card { position: absolute; inset: 48px; border-radius: 36px; background: rgba(255,255,255,.06);
          border: 1.5px solid rgba(255,255,255,.14); backdrop-filter: blur(30px);
          display: flex; align-items: center; gap: 56px; padding: 0 72px; }
  img { width: 230px; height: 230px; filter: drop-shadow(0 24px 50px rgba(109,92,255,.55)); flex: none; }
  h1 { font-size: 76px; margin: 0; letter-spacing: -2px; font-weight: 750; }
  p { font-size: 34px; line-height: 1.3; margin: 14px 0 0; color: rgba(243,244,250,.75); }
  .tag { display: inline-block; margin-top: 26px; font-size: 24px; padding: 10px 22px; border-radius: 999px;
         background: linear-gradient(135deg, #8b6cff, #2fc6ff); font-weight: 600; }
</style></head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="card">
    <img src="../ui/logo.svg" alt="">
    <div>
      <h1>VideoGrab</h1>
      <p>Téléchargez une vidéo ou juste l'extrait dont votre montage a besoin.</p>
      <span class="tag">Gratuit · Windows · 1000+ sites</span>
    </div>
  </div>
</body></html>
