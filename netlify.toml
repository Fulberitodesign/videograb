# Site de presentation de VideoGrab : seulement le dossier docs/.
# base = "docs" evite que Netlify installe les dependances de l'application Electron
# (package.json a la racine), inutiles pour une page web.
[build]
  base = "docs"
  publish = "."
  command = ""

[[headers]]
  for = "/demo/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
